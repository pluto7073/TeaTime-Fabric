import java.nio.file.Files

String getChangelog() {
    String base = Files.readString(file("CHANGELOG.md").toPath())
    return base.split("---")[0].trim()
}

ext {
    changelog_text = getChangelog()
}

tasks.register("publishMod") {
    group "publishing"
    dependsOn(tasks.modrinth)
    dependsOn(tasks.githubRelease)
    //dependsOn(tasks.curseforge) TODO get curseforge going
}

// Maven Publishing
publishing {
    repositories {
        maven {
            url = System.getenv("PUBLISH_LOCATION")
        }
    }

    publications {

        mavenJava(MavenPublication) {
            artifactId = 'teatime'

            from(components.java)
            pom.withXml {
                Node pom = asNode()
                pom.dependencies.'*'.findAll() {
                    it.artifactId.text() != 'pdapi'
                }.each() {
                    it.parent().remove(it)
                }
            }
        }
    }
}

// Github

tasks.githubRelease.dependsOn(tasks.build)

githubRelease {
    token = System.getenv("GH_TOKEN") ?: ""
    targetCommitish = "1.20"
    body = changelog_text
    releaseAssets = [file("build/libs/${archives_base_name}-${version}.jar") , file("build/libs/${archives_base_name}-${version}-sources.jar")]
    repo = "TeaTime-Fabric"
}

